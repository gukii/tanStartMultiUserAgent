# Nixpacks configuration for Railway
# Prevents auto-detection and explicitly controls build process

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-9_x"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  # Set dummy database path for build phase (persistent volume not available yet)
  "TELEMETRY_DB_URL=file:/tmp/build-dummy.db VITE_ENABLE_AI_AGENT=true pnpm build"
]

[start]
cmd = "pnpm start"
